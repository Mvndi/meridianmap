<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Mvndicraft Map</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover" />
        <meta
            name="description"
            content="Live Mvndicraft map. Explore towns, nations, religions, players and markets."
        />
        <link rel="canonical" href="https://map.mvndicraft.net/" />
        <meta name="theme-color" content="#111315" />
        <meta property="og:site_name" content="Mvndicraft" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://map.mvndicraft.net/" />
        <meta property="og:title" content="Mvndicraft Map" />
        <meta
            property="og:description"
            content="Live Mvndicraft map. Explore towns, nations, religions, players and markets."
        />
        <meta property="og:image" content="https://map.mvndicraft.net/images/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Mvndicraft Map" />
        <meta
            name="twitter:description"
            content="Live Mvndicraft map. Explore towns, nations, religions, players and markets."
        />
        <meta name="twitter:image" content="https://map.mvndicraft.net/images/og.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="icon" href="images/favicon.png" sizes="64x64" type="image/png" />
        <link rel="apple-touch-icon" href="images/logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        />
        <script type="module" src="src/js/Squaremap.js"></script>
    </head>
    <body>
        <header id="topbar">
            <div class="brand-group">
                <a class="brand" href="https://mvndicraft.net/" aria-label="Mvndicraft home">
                    <img src="images/mvndicraft-logo.png" alt="Mvndicraft" width="154" height="48" />
                </a>
                <button id="copy-server" type="button" title="Copy mc.mvndicraft.net" aria-label="Copy server address">
                    <span class="online-dot" aria-hidden="true">●</span><span id="nav-online">Connecting…</span>
                </button>
            </div>
            <button
                id="nav-toggle"
                type="button"
                aria-label="Toggle navigation"
                aria-controls="site-navigation"
                aria-expanded="false"
            >
                ☰
            </button>
            <nav id="site-navigation" class="links" aria-label="Mvndicraft sites">
                <a href="https://mvndicraft.net/">Home</a>
                <a
                    href="https://www.planetminecraft.com/server/mvndicraft-medieval-geopol/"
                    target="_blank"
                    rel="noreferrer"
                    >Vote</a
                >
                <a href="https://wiki.mvndicraft.net/rules.html" target="_blank" rel="noreferrer">Rules</a>
                <a href="https://wiki.mvndicraft.net/" class="nav-wiki" target="_blank" rel="noreferrer">Wiki</a>
                <a href="https://store.mvndicraft.net/" class="nav-store" target="_blank" rel="noreferrer">Store</a>
            </nav>
            <span id="nav-status" class="sr-only" role="status"></span>
        </header>

        <div id="map"></div>

        <aside id="msidebar" aria-label="Map panel">
            <button
                id="msidebar-toggle"
                type="button"
                aria-controls="msidebar"
                aria-expanded="true"
                aria-label="Hide panel"
            >
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" />
                </svg>
            </button>
            <div class="scroll">
                <section class="cat" id="cat-modes" data-open="true">
                    <button class="cat-h" type="button" aria-expanded="true">
                        <span class="cat-t">Map mode</span>
                        <svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                            <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" />
                        </svg>
                    </button>
                    <div class="cat-b">
                        <div class="mode-buttons" role="group" aria-label="Map mode">
                            <button type="button" data-map-mode="political" aria-pressed="true">Political</button>
                            <button type="button" data-map-mode="religion" aria-pressed="false">Religion</button>
                            <button type="button" data-map-mode="diplomacy" aria-pressed="false">Diplomacy</button>
                        </div>
                        <div id="diplomacy-controls" hidden>
                            <label class="mode-label" for="diplomacy-nation">Nation perspective</label>
                            <select id="diplomacy-nation" class="search">
                                <option value="">Choose a nation</option>
                            </select>
                        </div>
                        <p id="mode-context" class="meta" aria-live="polite"></p>
                        <div id="mode-legend" class="mode-legend" aria-label="Map legend"></div>
                    </div>
                </section>

                <section class="cat" id="cat-toggles" data-open="true">
                    <button class="cat-h" type="button" aria-expanded="true">
                        <span class="cat-t">Layers</span>
                        <svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                            <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" />
                        </svg>
                    </button>
                    <div class="cat-b">
                        <div id="world-list" class="worlds" role="group" aria-label="World"></div>
                        <div id="toggle-list" class="toggles"></div>
                    </div>
                </section>

                <section class="cat" id="cat-players" data-open="false">
                    <button class="cat-h" type="button" aria-expanded="false">
                        <span class="cat-t">Players</span>
                        <span id="player-count" class="chip">0 online</span>
                        <svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                            <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" />
                        </svg>
                    </button>
                    <div class="cat-b" hidden>
                        <p id="player-summary" class="meta" aria-live="polite">0 visible · 0 hidden from the map</p>
                        <input
                            id="player-search"
                            class="search"
                            type="search"
                            placeholder="Find a player"
                            autocomplete="off"
                            spellcheck="false"
                            aria-label="Find a player"
                        />
                        <div id="player-list" class="plist"></div>
                        <p id="player-empty" class="empty">Nobody is online right now.</p>
                    </div>
                </section>

                <section class="cat" id="cat-markets" data-open="false">
                    <button class="cat-h" type="button" aria-expanded="false">
                        <span class="cat-t">Markets</span>
                        <span id="market-count" class="chip">0</span>
                        <svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                            <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" />
                        </svg>
                    </button>
                    <div class="cat-b" hidden>
                        <input
                            id="market-search"
                            class="search"
                            type="search"
                            placeholder="Find an item, town or seller"
                            autocomplete="off"
                            spellcheck="false"
                            aria-label="Search markets by item, town or seller"
                        />
                        <p id="market-meta" class="meta"></p>
                        <div id="market-list" class="slist"></div>
                    </div>
                </section>
            </div>
        </aside>
    </body>
</html>
